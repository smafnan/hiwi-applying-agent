version: '3.8'

services:
  # Portal Frontend (React + Vite)
  web:
    build:
      context: ./portal
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_APP_NAME=HiWi Applying Agent
    depends_on:
      - api
    networks:
      - hiwi-network

  # Portal Backend (FastAPI)
  api:
    build:
      context: ./portal
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - DATABASE_URL=sqlite:///./hiwi.db
      - UPLOAD_DIR=./uploads
    volumes:
      - ./portal/uploads:/app/uploads
      - ./portal/hiwi.db:/app/hiwi.db
    networks:
      - hiwi-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Optional: Agent API (if needed separately)
  # agent:
  #   build:
  #     context: ./app
  #   ports:
  #     - "8001:8000"
  #   environment:
  #     - NVIDIA_API_KEY=${NVIDIA_API_KEY}
  #   networks:
  #     - hiwi-network

  # Optional: Nginx Reverse Proxy
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - web
  #     - api
  #   networks:
  #     - hiwi-network

networks:
  hiwi-network:
    driver: bridge
